        function track(label) {
          if (!label) return;
          if (typeof gtag !== 'function') return;
          gtag('event', 'conversion', { send_to: TAG + '/' + label });
        }

        document.addEventListener('click', function (e) {
          var el = e.target;
          var a = el && el.closest ? el.closest('a[href]') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          if (href.indexOf('wa.me') > -1 || href.indexOf('api.whatsapp.com') > -1) track(LABELS.whatsapp);
          else if (href.indexOf('tel:') === 0) track(LABELS.call);
        }, true);

        // نموذج الحجز يفتح واتساب عبر window.open، فنرصد الإرسال نفسه

          if (e.target && e.target.tagName === 'FORM') track(LABELS.booking);
